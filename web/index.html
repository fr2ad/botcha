<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Botcha — 1-3 bots at the table. Find them.</title>
    <meta name="description" content="Chat anonymously for 3 rounds with 3 other seats, then guess which ones are AI. 1-3 of them are bots — you're never told how many." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0f" />
    <!-- iOS ignores the manifest: it reads these three for the home-screen icon,
         the standalone launch, and the status bar over the dark background. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Botcha" />

    <!-- Link previews (Discord, X, iMessage, WhatsApp, Reddit, ...). Absolute
         URL required — a relative one silently fails on most crawlers. Keep
         this og:url as the canonical share destination even though every
         actual invite link carries a ?ref= code; crawlers de-dupe on it. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://botcha.far2ad.space/" />
    <meta property="og:title" content="Botcha — 1-3 bots at the table. Find them." />
    <meta property="og:description" content="Chat anonymously for 3 rounds, then guess which seats are AI. 1-3 of them are bots — you're never told how many." />
    <meta property="og:image" content="https://botcha.far2ad.space/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Botcha — 1-3 bots at the table. Find them." />
    <meta name="twitter:description" content="Chat anonymously for 3 rounds, then guess which seats are AI." />
    <meta name="twitter:image" content="https://botcha.far2ad.space/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
